services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading_password}
      POSTGRES_DB: ${POSTGRES_DB:-trading_dashboard}
    ports:
      - "5442:5432"
    volumes:
      - trading_dashboard_postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-trading} -d $${POSTGRES_DB:-trading_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading_dashboard_net

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - trading_dashboard_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading_dashboard_net

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://trading:trading_password@postgres:5432/trading_dashboard}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      API_BASE_URL: ${WORKER_API_BASE_URL:-http://api:8001}
      ENABLE_LIVE_TRADING: ${ENABLE_LIVE_TRADING:-false}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      LINE_USER_ID: ${LINE_USER_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-dev_webhook_secret}
      NOTIFICATION_DRY_RUN: ${NOTIFICATION_DRY_RUN:-true}
      NOTIFICATION_COOLDOWN_HOURS: ${NOTIFICATION_COOLDOWN_HOURS:-4}
      WORKER_AUTOMATION_ENABLED: ${WORKER_AUTOMATION_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AI_BRIEF_ENABLED: ${AI_BRIEF_ENABLED:-true}
      AI_BRIEF_MODEL: ${AI_BRIEF_MODEL:-gpt-4o-mini}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      NEWS_API_ENABLED: ${NEWS_API_ENABLED:-false}
      UDN_RSS_ENABLED: ${UDN_RSS_ENABLED:-false}
    ports:
      - "8011:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading_dashboard_net

  worker:
    build:
      context: ./apps/worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://trading:trading_password@postgres:5432/trading_dashboard}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ENABLE_LIVE_TRADING: ${ENABLE_LIVE_TRADING:-false}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      LINE_USER_ID: ${LINE_USER_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      NOTIFICATION_DRY_RUN: ${NOTIFICATION_DRY_RUN:-true}
      NOTIFICATION_COOLDOWN_HOURS: ${NOTIFICATION_COOLDOWN_HOURS:-4}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib; raise SystemExit(0 if pathlib.Path('/tmp/worker-ready').exists() else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading_dashboard_net

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8011}
    ports:
      - "3100:3100"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading_dashboard_net

networks:
  trading_dashboard_net:

volumes:
  trading_dashboard_postgres_data:
  trading_dashboard_redis_data:
